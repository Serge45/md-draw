name: Publish Extension

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Build & Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & Check
        run: |
          npm ci
          npm run compile
          npm run check:overlay

      - name: Package .vsix
        run: npx --yes @vscode/vsce package --out markdown-draw-overlay.vsix

      - name: Publish to VS Code Marketplace (OIDC)
        run: npx --yes @vscode/vsce publish --oidc --packagePath markdown-draw-overlay.vsix

      - name: Attach .vsix to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" markdown-draw-overlay.vsix --clobber
